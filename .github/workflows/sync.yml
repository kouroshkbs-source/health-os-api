name: Garmin → Notion Sync

on:
  schedule:
    # Run every 2 hours during the day for step updates
    - cron: '0 5 * * *'   # 06:00 Belgium
    - cron: '0 7 * * *'   # 08:00 Belgium
    - cron: '0 9 * * *'   # 10:00 Belgium
    - cron: '0 11 * * *'  # 12:00 Belgium
    - cron: '0 13 * * *'  # 14:00 Belgium
    - cron: '0 15 * * *'  # 16:00 Belgium
    - cron: '0 17 * * *'  # 18:00 Belgium
    - cron: '0 19 * * *'  # 20:00 Belgium
    - cron: '0 21 * * *'  # 22:00 Belgium
  workflow_dispatch: # Manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install garth garminconnect httpx

    - name: Run Garmin → Notion Sync
      env:
        GARMIN_OAUTH_TOKEN: ${{ secrets.GARMIN_OAUTH_TOKEN }}
        GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      run: python sync_garmin.py
