name: Garmin → Notion Sync

on:
  schedule:
    # Multiple runs in the morning to catch data after wake-up
    # Times in UTC (Belgium = UTC+1 in winter, UTC+2 in summer)
    - cron: '0 5 * * *'   # 06:00 Belgium winter / 07:00 summer
    - cron: '0 6 * * *'   # 07:00 Belgium winter / 08:00 summer
    - cron: '0 7 * * *'   # 08:00 Belgium winter / 09:00 summer
    - cron: '0 8 * * *'   # 09:00 Belgium winter / 10:00 summer
  workflow_dispatch: # Manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install garth garminconnect httpx

    - name: Run Garmin → Notion Sync
      env:
        GARMIN_OAUTH_TOKEN: ${{ secrets.GARMIN_OAUTH_TOKEN }}
        GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      run: python sync_garmin.py
